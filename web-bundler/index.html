        <style>
            /**
       * Extend the react-native-web reset:
       * https://github.com/necolas/react-native-web/blob/master/packages/react-native-web/src/exports/StyleSheet/initialRules.js
       */
            * {
                flex-basis: auto !important;
            }

            html,
            body,
            #root {
                width: 100%;
                /* To smooth any scrolling behavior */
                -webkit-overflow-scrolling: touch;
                margin: 0px;
                padding: 0px;
                /* Allows content to fill the viewport and go beyond the bottom */
                min-height: 100%;
                /* AND bind the app shell to the viewport (AT-2177).
                   react-navigation used to render every screen in an
                   absolutely-positioned card, which was the only thing giving
                   the tree a DEFINITE height; migration Stage 2 deleted it
                   (AppNavigator renders the screen in normal flow now), so with
                   min-height alone every "flex: 1" box grew to its content
                   instead. The sidebar's and the main view's CustomScrollViews
                   then never scrolled internally: the document was the only
                   scroller, so scrolling the main content dragged the sidebar
                   navigation and the top bar off-screen with it. A definite
                   height re-closes the chain and each pane scrolls on its own.
                   body keeps overflow-y: auto below as a safety valve for any
                   screen without an inner scroller. */
                height: 100%;
                /* safe-area padding on body must not push the shell past 100% */
                box-sizing: border-box;
            }

            #root {
                flex-shrink: 0;
                flex-basis: auto;
                flex-grow: 1;
                display: flex;
                flex: 1;
            }

            /* Mobile virtual keyboard (AT-2248).
               On iOS Safari the keyboard does not resize the layout viewport, it
               covers it — so the shell above stays full height and every inner
               CustomScrollView still believes a composer behind the keyboard is
               visible. utils/virtualKeyboard.js measures the covered strip with
               `visualViewport`, publishes it as --app-keyboard-inset and adds
               this class; shrinking the shell by it is what makes each pane's
               clientHeight equal the ACTUALLY visible area, so the ordinary
               minimal scroll correction works and bottom-anchored composers ride
               above the keyboard.
               Only <html> takes the subtraction — body and #root resolve their
               100% against it, so applying the calc to all three would shrink
               twice. min-height has to be released as well, or the 100% above
               (which resolves against the FULL viewport) would win over the
               height and nothing would move. */
            html.app-keyboard-open {
                height: calc(100% - var(--app-keyboard-inset, 0px));
                min-height: 0;
            }

            html.app-keyboard-open body,
            html.app-keyboard-open #root {
                height: 100%;
                min-height: 0;
            }

            html {
                /* Without this fixed positioning the Root view show both vertical and horizontal scrollbars */
                /*position: fixed;*/
                scroll-behavior: smooth;
                /* Prevent text size change on orientation change https://gist.github.com/tfausak/2222823#file-ios-8-web-app-html-L138 */
                -webkit-text-size-adjust: 100%;
                height: 100%;
            }

            body {
                display: flex;
                /* Allows you to scroll below the viewport; default value is visible */
                overflow-y: auto;
                overscroll-behavior-y: none;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                -ms-overflow-style: scrollbar;
                padding-top: env(safe-area-inset-top) !important;
                padding-left: env(safe-area-inset-left) !important;
                padding-right: env(safe-area-inset-right) !important;
            }

            .react-tiny-popover-container {
                box-shadow: 0px 4px 16px rgba(78, 93, 120, 0.56);
            }
