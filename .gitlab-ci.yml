image: node:12

workflow:
    auto_cancel:
        # A newer commit may stop builds/checks, but never a deployment.
        on_new_commit: interruptible
    rules:
        # Keep one pipeline per branch commit. API, web/manual, schedule, tag,
        # parent/child and MR-event pipelines need an explicit future opt-in;
        # otherwise change-based jobs can unexpectedly become a full pipeline.
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
        - when: never

default:
    # Build, test, and read-only jobs are safe to supersede. Every job that
    # changes a deployed environment overrides this to false.
    interruptible: true

stages:
    # - clean
    - build_base
    - build_web
    - deploy_web
    - update_version

# Maintain the web dependency boundary in one place. Documentation, functions,
# Cloudflare, Firestore indexes/rules, and other infrastructure-only changes are
# intentionally absent.
.web-relevant-changes:
    rules:
        - changes: &web-relevant-paths
              - .gitlab-ci.yml
              - App*.js
              - index.js
              - app.json
              - babel.config.js
              - metro.config.js
              - webpack.config.js
              - tsconfig.json
              - package.json
              - package-lock.json
              - package-optimized-build-bundle.json
              - firebase.json
              - .firebaserc
              - ci/Dockerfile_base
              - ci/github-push.sh
              - ci/replace-envs.sh
              - Themes/**/*
              - URLSystem/**/*
              - __mocks__/**/*
              - __tests__/**/*
              - apis/**/*
              - assets/**/*
              - components/**/*
              - hooks/**/*
              - i18n/**/*
              - redux/**/*
              - replacement_node_modules/**/*
              - utils/**/*
              - web/**/*
              - web-bundler/**/*
              - ci/Dockerfile_web_bundler

# The images below bake node_modules, and they are rebuilt only on develop and
# master. A feature branch that changes the dependency tree therefore builds and
# tests against the PREVIOUS lockfile's node_modules, so every import the bump
# adds fails to resolve — the firebase 8 -> 12 branch hit exactly this, with
# "Can't resolve 'firebase/compat/app'" in webpack and jest while both were green
# locally. Rebuilding :latest from a branch is not an option: master builds from
# that tag. Such a branch instead builds its own images under
# :$CI_COMMIT_REF_SLUG, and the jobs consuming node_modules select that tag via
# a rules-level APP_IMAGE_TAG (defaulting to latest everywhere else).
# The path list is the union of everything baked into either image, so the base
# image a branch-scoped bundler image is built FROM always exists.
.branch-image-changes:
    rules:
        - changes: &branch-image-paths
              - package.json
              - package-lock.json
              - web-bundler/package.json
              - web-bundler/package-lock.json
              - ci/Dockerfile_base
              - ci/Dockerfile_web_bundler

#clean_workspace:
#    stage: clean
#    script:
#        - rm -rf web-build/
#        - rm -rf node_modules/
#    allow_failure: true

modules_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_base --destination $CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - package.json
              - package-lock.json
              # The image is also stale when its own recipe changes.
              - ci/Dockerfile_base
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG

# Tooling image for the standalone webpack pipeline (FRONTEND_MIGRATION_PLAN.md
# Stage 0): Node 22 + web-bundler's own npm-ci'd tooling, with the app's
# node_modules copied in from the legacy base image. Runs after modules_cache when
# both rebuild so it copies the fresh app dependency tree.
web_bundler_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    needs:
        - job: modules_cache
          optional: true
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_web_bundler --build-arg BASE_IMAGE=$CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG --destination $CI_REGISTRY_IMAGE/build_web_bundler:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - package.json
              - package-lock.json
              - web-bundler/package.json
              - web-bundler/package-lock.json
              - ci/Dockerfile_web_bundler
              # This image COPYs /app/node_modules out of the base image, so it
              # is stale whenever the base image's recipe changes too.
              - ci/Dockerfile_base
        # Same union of paths as modules_cache's branch rule, so the branch-scoped
        # base image this is built FROM has always been produced by that job.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG

firebase_cmd_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_firebase --destination $CI_REGISTRY_IMAGE/build_firebase:latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - ci/Dockerfile_firebase

functions_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_functions --destination $CI_REGISTRY_IMAGE/build_functions:latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - ci/Dockerfile_functions
              - functions/package.json
              - functions/package-lock.json

test:web:changed:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    before_script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        # GitLab's checkout may not contain the default-branch ref, and what it
        # does contain stops at the depth-50 shallow boundary. Fetch that ref and
        # deepen only as far as a merge base needs, so Jest can select tests
        # affected by the complete branch diff.
        - sh ci/ensureMergeBase.sh "$CI_DEFAULT_BRANCH"
        # Unlike the web builds, this job never substitutes the BEGIN-ENVS block,
        # and .env is not in the repository. react-native-dotenv resolves those
        # imports during transform, so without placeholders every suite reaching
        # utils/backends/firestore.js fails to parse.
        - node ci/writeTestEnv.js
    script:
        # Functions have their own dependency tree and tests. Exclude them from
        # this root/web check when a commit happens to change both surfaces.
        # The selector keeps them out of the input; ci/jest.web.config.js keeps
        # them out of what --findRelatedTests selects, which the input filter
        # cannot do on its own because functions/shared imports utils/backends.
        # Jest's dependency graph treats shared data such as every translation
        # JSON as related to most of the application. The selector keeps data
        # and infrastructure out, while preferring a changed co-located test
        # over traversing the source file's entire legacy dependency graph.
        - node --check ci/selectTargetedJestFiles.js
        - node --check ci/jest.web.config.js
        # Never pipe the selection straight into xargs. `xargs -r` skips the run
        # on empty input and a pipeline reports only its last exit status, so a
        # selector that died looked exactly like a clean run: green job, no Jest.
        # Materialise the selection instead, let a non-zero selector exit fail
        # the job, and keep the "legitimately nothing to run" case explicit.
        # The selector's exit status is checked explicitly rather than through
        # `set -e`, whose behaviour varies by shell - implicit status handling is
        # what hid this in the first place.
        - |
            if node ci/selectTargetedJestFiles.js "origin/$CI_DEFAULT_BRANCH" > /tmp/targeted-jest-files.z; then
                if [ -s /tmp/targeted-jest-files.z ]; then
                    xargs -0 npm test -- --config ci/jest.web.config.js --runInBand --findRelatedTests --passWithNoTests < /tmp/targeted-jest-files.z
                else
                    echo "No Jest input selected, so no suites will run. See the selection summary above for why."
                fi
            else
                echo "ERROR: the targeted Jest selection failed, so this job would test nothing. Failing instead of reporting success." >&2
                exit 1
            fi
    rules:
        # Must precede the generic web-relevant rule: first match wins, and a
        # dependency-changing branch has to run against its own image.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths:
                  - .gitlab-ci.yml
                  - ci/ensureMergeBase.sh
                  - ci/jestSetup.js
                  - ci/jest.web.config.js
                  - ci/selectTargetedJestFiles.js
                  - ci/writeTestEnv.js

# test:web:changed selects suites from the branch-vs-master diff, which is empty
# by construction on master and develop — so it is excluded there, and until this
# job existed it was the ONLY job in the pipeline running Jest. Both deploy paths,
# production and staging, therefore shipped on a successful webpack compile alone.
# This runs the whole web suite on those two branches and gates their deploys
# (see the `needs` on deploy:web and deploy:web-dev — without being in `needs` a
# test job only goes red *beside* a deploy that already shipped).
# The cost is small next to what it guards: it shares the build_web stage with a
# ~9-minute production build, so it adds little wall clock.
# Its rules deliberately mirror build_web_production/build_web_staging, so
# whenever a deploy is in the pipeline this job is too and `needs` always resolves.
test:web:full:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_base:latest
    before_script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        # Same reason as test:web:changed: .env is not in the repository and
        # react-native-dotenv resolves those imports during transform, so without
        # placeholders every suite reaching utils/backends/firestore.js fails to parse.
        - node ci/writeTestEnv.js
    script:
        # No selection step here — this is the whole web suite by design.
        # ci/jest.web.config.js excludes functions/, whose separate dependency
        # tree this image does not carry.
        - npm test -- --config ci/jest.web.config.js --runInBand
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes: *web-relevant-paths

build_web_staging:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:latest
    before_script:
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\n const GOOGLE_FIREBASE_WEB_DATABASE_URL = "'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'"\n const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\n const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\n const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\n const SENTRY_DSN = "'"$SENTRY_DSN"'"\n const HOSTING_URL = "'"$HOSTING_URL_DEV"'"\n const CURRENT_ENVIORNMENT = "'"$CURRENT_ENVIORNMENT_DEV"'"\n const NOTES_COLLABORATION_SERVER = "'"$NOTES_COLLABORATION_SERVER"'"\n const ALGOLIA_APP_ID = "'"$ALGOLIA_APP_ID_DEV"'"\n const ALGOLIA_SEARCH_ONLY_API_KEY = "'"$ALGOLIA_SEARCH_ONLY_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\n const IP_REGISTRY_API_KEY = "'"$IP_REGISTRY_API_KEY"'"\n const SIB_MARKETING_SERVICE_LIST = "'"$SIB_MARKETING_SERVICE_LIST_DEV"'"\n const GIPHY_API_KEY = "'"$GIPHY_API_KEY_DEV"'"\n const PERPLEXITY_API_KEY = "'"$PERPLEXITY_API_KEY_DEV"'"' utils/backends/firestore.js
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"' apis/google/apisConfig.js
        - echo "DEBUG - Checking if MCP config file exists before replacement:"
        - ls -la functions/MCP/config/environments.js || echo "MCP config file not found"
        - echo "DEBUG - Content before MCP replacement:"
        - grep -A 10 -B 5 "BEGIN-ENVS" functions/MCP/config/environments.js || echo "BEGIN-ENVS not found"
        - echo "DEBUG - Environment variables being used for MCP (DEV):"
        - echo "API_KEY:" ${GOOGLE_FIREBASE_WEB_API_KEY_DEV:0:20}...
        - echo "AUTH_DOMAIN:" $GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV
        - echo "PROJECT_ID:" $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV
        - echo "MCP_BASE_URL_DEV:" $MCP_BASE_URL_DEV
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_DEV"'"' functions/MCP/config/environments.js
        - echo "DEBUG - Content after MCP replacement:"
        - grep -A 10 -B 5 "GOOGLE_FIREBASE_WEB_API_KEY" functions/MCP/config/environments.js || echo "Replacement failed"
        - sed -i 's|__FIREBASE_API_KEY__|'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'|g; s|__FIREBASE_AUTH_DOMAIN__|'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'|g; s|__FIREBASE_DATABASE_URL__|'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'|g; s|__FIREBASE_PROJECT_ID__|'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'|g; s|__FIREBASE_STORAGE_BUCKET__|'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'|g; s|__FIREBASE_MESSAGING_SENDER_ID__|'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'|g; s|__FIREBASE_APP_ID__|'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'|g' web/firebase-messaging-sw.js
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - web-build/
            - firebase.json
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes: *web-relevant-paths

# Feature-branch web build on the webpack pipeline (web-bundler/, Node 22).
# develop and master run the real build_web_staging / build_web_production jobs
# (same pipeline, env-specific injection); this job gives branches compile
# signal and feeds the manual preview-channel deploy.
build_web_webpack_check:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    before_script:
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\n const GOOGLE_FIREBASE_WEB_DATABASE_URL = "'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'"\n const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\n const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\n const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\n const SENTRY_DSN = "'"$SENTRY_DSN"'"\n const HOSTING_URL = "'"$HOSTING_URL_DEV"'"\n const CURRENT_ENVIORNMENT = "'"$CURRENT_ENVIORNMENT_DEV"'"\n const NOTES_COLLABORATION_SERVER = "'"$NOTES_COLLABORATION_SERVER"'"\n const ALGOLIA_APP_ID = "'"$ALGOLIA_APP_ID_DEV"'"\n const ALGOLIA_SEARCH_ONLY_API_KEY = "'"$ALGOLIA_SEARCH_ONLY_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\n const IP_REGISTRY_API_KEY = "'"$IP_REGISTRY_API_KEY"'"\n const SIB_MARKETING_SERVICE_LIST = "'"$SIB_MARKETING_SERVICE_LIST_DEV"'"\n const GIPHY_API_KEY = "'"$GIPHY_API_KEY_DEV"'"\n const PERPLEXITY_API_KEY = "'"$PERPLEXITY_API_KEY_DEV"'"' utils/backends/firestore.js
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"' apis/google/apisConfig.js
        - sed -i 's|__FIREBASE_API_KEY__|'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'|g; s|__FIREBASE_AUTH_DOMAIN__|'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'|g; s|__FIREBASE_DATABASE_URL__|'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'|g; s|__FIREBASE_PROJECT_ID__|'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'|g; s|__FIREBASE_STORAGE_BUCKET__|'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'|g; s|__FIREBASE_MESSAGING_SENDER_ID__|'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'|g; s|__FIREBASE_APP_ID__|'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'|g' web/firebase-messaging-sw.js
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    artifacts:
        expire_in: 1 days
        when: on_success
        name: 'web-build-webpack'
        paths:
            - web-build/
            - firebase.json
    rules:
        # Must precede the generic web-relevant rule: first match wins, and a
        # dependency-changing branch has to build against its own image.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths

build_web_production:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:latest
    # The before_script mirrors master to GitHub, so unlike pure build jobs this
    # job has an external side effect and must finish once started.
    interruptible: false
    before_script:
        - pwd
        - ls -la ci/
        - chmod +x ci/github-push.sh ci/replace-envs.sh
        - sh ci/github-push.sh
        - sh ci/replace-envs.sh
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    after_script:
        # here used to be the github push

    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - web-build/
            - firebase.json
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes: *web-relevant-paths

# Manual QA gate for the webpack pipeline (migration Stage 0 acceptance): publish
# the shadow build's artifact to a Firebase Hosting preview channel on the staging
# project (.firebaserc default; the shadow build injects the _DEV env values, so
# the artifact talks to staging). Once this channel passes the parity checklist,
# deploy:web's `needs` flips to build_web_webpack_check's successor and the expo
# pipeline can be deleted.
deploy:web-webpack-preview:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    # optional: the shadow build's rules use compare_to on branches, so a push
    # with no web-relevant diff (e.g. creating a branch off master) creates a
    # pipeline without it — a hard `needs` made that pipeline invalid. The job
    # is manual, so it is only ever played when the build actually ran.
    needs:
        - job: 'build_web_webpack_check'
          optional: true
    script:
        - firebase --version
        - firebase hosting:channel:deploy --token $GOOGLE_FIREBASE_DEPLOY_TOKEN webpack-$CI_COMMIT_REF_SLUG
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes: *web-relevant-paths
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
          when: manual
          allow_failure: true

# Staging's live site is normally published by deploy:web-dev from `develop`, but
# that branch has drifted far behind master, so a feature branch has no way to
# reach it. The preview channel above covers most QA, but NOT Google sign-in:
# Google Identity Services enforces an authorized-JavaScript-origin allowlist on
# the OAuth client, and a generated preview origin is not on it (that list lives
# in Google Cloud Console, so no deploy can add it). This job publishes a branch
# build to the staging site's live channel, on the registered origin, so auth
# flows can actually be tested before a stage merges.
# Manual and never automatic — it replaces whatever staging currently serves. The
# project is named explicitly rather than relying on the .firebaserc default, so a
# mis-click cannot reach production.
deploy:web-staging-live:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - job: 'build_web_webpack_check'
          optional: true
    script:
        - firebase --version
        - firebase use $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
    environment:
        name: staging
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
          when: manual
          allow_failure: true

deploy:web:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - 'build_web_production'
        # Blocking on purpose: a test job outside `needs` only turns red next to
        # a deploy that has already shipped.
        - 'test:web:full'
    script:
        - firebase use $GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
    environment:
        name: production
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes: *web-relevant-paths

deploy:web-dev:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - 'build_web_staging'
        # Blocking on purpose, same as deploy:web.
        - 'test:web:full'
    script:
        - firebase --version
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
    environment:
        name: staging
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes: *web-relevant-paths

deploy:cloud:functions:staging:
    image: $CI_REGISTRY_IMAGE/build_functions:latest
    stage: deploy_web
    # Serialize functions deploys: two pushes in quick succession otherwise run
    # `firebase deploy` concurrently and the older commit can finish last,
    # overwriting the newer code (last writer wins per function).
    resource_group: functions-staging-deploy
    interruptible: false
    before_script:
        - echo "DEBUG - Replacing MCP config for functions deployment"
        - echo "Environment variables for MCP functions (DEV):"
        - echo "API_KEY:" ${GOOGLE_FIREBASE_WEB_API_KEY_DEV:0:20}...
        - echo "AUTH_DOMAIN:" $GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV
        - echo "PROJECT_ID:" $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV
        - echo "MCP_BASE_URL_DEV:" $MCP_BASE_URL_DEV
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_DEV"'"' functions/MCP/config/environments.js
        - echo "DEBUG - MCP config after replacement:"
        - grep -A 10 -B 5 "GOOGLE_FIREBASE_WEB_API_KEY" functions/MCP/config/environments.js || echo "Replacement failed"
        - cd functions
        - ln -s /functions/node_modules node_modules
        - echo "$GOOGLE_SERVICE_ACCOUNT_DEVELOP" > service_accounts/serv_account_key_develop.json
        - echo "$GOOGLE_SERVICE_ACCOUNT_MASTER" > service_accounts/serv_account_key_master.json
        - echo "$GOOGLE_FUNCTIONS_ENV_DEV" > env_functions.json
        - chmod +x service_accounts/setup_functions.sh
        - npm run setup_functions
    script:
        - firebase use $(< tmp_project_name) --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only functions --token $GOOGLE_FIREBASE_DEPLOY_TOKEN --non-interactive --force -m "Pipeline $CI_PIPELINE_ID, build $CI_BUILD_ID"
        - rm -rf tmp_project_name
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
              - functions/**/*
              # firebase.json carries the functions runtime, region and ignore list,
              # so a change there has to redeploy them too.
              - firebase.json

deploy:cloud:functions:production:
    image: $CI_REGISTRY_IMAGE/build_functions:latest
    stage: deploy_web
    # Serialize functions deploys: two pushes in quick succession otherwise run
    # `firebase deploy` concurrently and the older commit can finish last,
    # overwriting the newer code (last writer wins per function).
    resource_group: functions-production-deploy
    interruptible: false
    before_script:
