# Fallback only — every real job pins its own image. Kept on the repo's Node
# major (see .nvmrc) so an unpinned job doesn't silently run on ancient Node.
image: node:22-alpine

workflow:
    auto_cancel:
        # A newer commit may stop builds/checks, but never a deployment.
        on_new_commit: interruptible
    rules:
        # Keep one pipeline per branch commit. API, web/manual, schedule, tag,
        # parent/child and MR-event pipelines need an explicit future opt-in;
        # otherwise change-based jobs can unexpectedly become a full pipeline.
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
        - when: never

default:
    # Build, test, and read-only jobs are safe to supersede. Every job that
    # changes a deployed environment overrides this to false.
    interruptible: true

stages:
    # - clean
    - build_base
    - build_web
    - deploy_web
    - update_version

# Maintain the web dependency boundary in one place. Documentation, functions,
# Cloudflare, Firestore indexes/rules, and other infrastructure-only changes are
# intentionally absent.
.web-relevant-changes:
    rules:
        - changes: &web-relevant-paths
              - .gitlab-ci.yml
              - App*.js
              - index.js
              - app.json
              - babel.config.js
              - metro.config.js
              - webpack.config.js
              - tsconfig.json
              - package.json
              - package-lock.json
              - .npmrc
              - package-optimized-build-bundle.json
              - firebase.json
              - .firebaserc
              - ci/Dockerfile_base
              - ci/github-push.sh
              - ci/replace-envs.sh
              - Themes/**/*
              - URLSystem/**/*
              - __mocks__/**/*
              - __tests__/**/*
              - apis/**/*
              - assets/**/*
              - components/**/*
              - hooks/**/*
              - i18n/**/*
              - redux/**/*
              - replacement_node_modules/**/*
              - utils/**/*
              - web/**/*
              - web-bundler/**/*
              - ci/Dockerfile_web_bundler

# The images below bake node_modules, and they are rebuilt only on develop and
# master. A feature branch that changes the dependency tree therefore builds and
# tests against the PREVIOUS lockfile's node_modules, so every import the bump
# adds fails to resolve — the firebase 8 -> 12 branch hit exactly this, with
# "Can't resolve 'firebase/compat/app'" in webpack and jest while both were green
# locally. Rebuilding :latest from a branch is not an option: master builds from
# that tag. Such a branch instead builds its own images under
# :$CI_COMMIT_REF_SLUG, and the jobs consuming node_modules select that tag via
# a rules-level APP_IMAGE_TAG (defaulting to latest everywhere else).
# The path list is the union of everything baked into either image, so the base
# image a branch-scoped bundler image is built FROM always exists.
.branch-image-changes:
    rules:
        - changes: &branch-image-paths
              - package.json
              - package-lock.json
              - .npmrc
              - web-bundler/package.json
              - web-bundler/package-lock.json
              - ci/Dockerfile_base
              - ci/Dockerfile_web_bundler

#clean_workspace:
#    stage: clean
#    script:
#        - rm -rf web-build/
#        - rm -rf node_modules/
#    allow_failure: true

# Decide ONCE per production pipeline what still has to ship, and publish the answer as an
# artifact every later job reads. See ci/deployScope.sh for the full reasoning; the short
# version is that scoping a deploy with `rules: changes:` asks "what did THIS push touch",
# which is the wrong question as soon as ci/assertNewestCommit.sh starts skipping
# superseded pipelines:
#
#   push A (functions/ only) -> its pipeline is superseded and skips its functions deploy
#   push B (components/ only) -> its pipeline never had a functions deploy job to begin with
#
# and A's change is deployed by nobody, with both pipelines green. Comparing against the
# last commit each target actually DEPLOYED makes the next pipeline pick up whatever the
# skipped one left behind, so the work always lands.
#
# Jobs read the artifact rather than each deciding for themselves so that a build, its
# tests and its deploy can never disagree about whether they are shipping.
deploy_scope:
    stage: build_base
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    script:
        # A cached older build_firebase:latest may predate git being baked in; the guard
        # jobs install it the same way. No-ops on every image that already has git.
        - command -v git >/dev/null 2>&1 || apk add --no-cache git
        - sh ci/deployScope.sh compute
    artifacts:
        expire_in: 1 week
        paths:
            - deploy-scope.env
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Mirror master to GitHub. This used to be build_web_production's before_script, which is
# the only reason that ~9-minute production build carried `interruptible: false` — so every
# superseded master push paid for a full production build just to reach this script. As its
# own job the build becomes cancellable again and the mirror still always runs.
#
# It also now runs on EVERY master push rather than only web-relevant ones: the mirror is a
# copy of the repository, so scoping it to web paths meant a functions-only push never
# reached GitHub until some later commit happened to touch the web.
#
# GIT_DEPTH: 0 because pushing real history to a repository that has it requires a complete
# local history; the old script paid for that with an --unshallow plus a gc/repack.
mirror:github:
    stage: build_base
    image:
        name: alpine/git
        entrypoint: ['']
    variables:
        GIT_DEPTH: 0
    # Pushes to an external system, so it must finish once started.
    interruptible: false
    # Two mirror jobs at once would race on the same branch; serialize them and let the
    # newest-commit guard drop the superseded one (its content is a strict subset).
    resource_group: github-mirror
    script:
        - sh ci/assertNewestCommit.sh mirror:github
        - sh ci/github-push.sh
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

modules_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_base --destination $CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - package.json
              - package-lock.json
              - .npmrc
              # The image is also stale when its own recipe changes.
              - ci/Dockerfile_base
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG

# Tooling image for the standalone webpack pipeline (FRONTEND_MIGRATION_PLAN.md
# Stage 0): Node 22 + web-bundler's own npm-ci'd tooling, with the app's
# node_modules copied in from the legacy base image. Runs after modules_cache when
# both rebuild so it copies the fresh app dependency tree.
web_bundler_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    needs:
        - job: modules_cache
          optional: true
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_web_bundler --build-arg BASE_IMAGE=$CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG --destination $CI_REGISTRY_IMAGE/build_web_bundler:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - package.json
              - package-lock.json
              - web-bundler/package.json
              - web-bundler/package-lock.json
              - ci/Dockerfile_web_bundler
              # This image COPYs /app/node_modules out of the base image, so it
              # is stale whenever the base image's recipe changes too.
              - ci/Dockerfile_base
        # Same union of paths as modules_cache's branch rule, so the branch-scoped
        # base image this is built FROM has always been produced by that job.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG

firebase_cmd_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_firebase --destination $CI_REGISTRY_IMAGE/build_firebase:latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - ci/Dockerfile_firebase

functions_cache:
    stage: build_base
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: ['']
    script:
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - /kaniko/executor --cache=true --push-retry 10 --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/ci/Dockerfile_functions --destination $CI_REGISTRY_IMAGE/build_functions:latest
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
          changes:
              - ci/Dockerfile_functions
              - functions/package.json
              - functions/package-lock.json

test:web:changed:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    before_script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        # GitLab's checkout may not contain the default-branch ref, and what it
        # does contain stops at the depth-50 shallow boundary. Fetch that ref and
        # deepen only as far as a merge base needs, so Jest can select tests
        # affected by the complete branch diff.
        - sh ci/ensureMergeBase.sh "$CI_DEFAULT_BRANCH"
        # Unlike the web builds, this job never substitutes the BEGIN-ENVS block,
        # and .env is not in the repository. react-native-dotenv resolves those
        # imports during transform, so without placeholders every suite reaching
        # utils/backends/firestore.js fails to parse.
        - node ci/writeTestEnv.js
    script:
        # Functions have their own dependency tree and tests. Exclude them from
        # this root/web check when a commit happens to change both surfaces.
        # The selector keeps them out of the input; ci/jest.web.config.js keeps
        # them out of what --findRelatedTests selects, which the input filter
        # cannot do on its own because functions/shared imports utils/backends.
        # Jest's dependency graph treats shared data such as every translation
        # JSON as related to most of the application. The selector keeps data
        # and infrastructure out, while preferring a changed co-located test
        # over traversing the source file's entire legacy dependency graph.
        - node --check ci/selectTargetedJestFiles.js
        - node --check ci/jest.web.config.js
        # Never pipe the selection straight into xargs. `xargs -r` skips the run
        # on empty input and a pipeline reports only its last exit status, so a
        # selector that died looked exactly like a clean run: green job, no Jest.
        # Materialise the selection instead, let a non-zero selector exit fail
        # the job, and keep the "legitimately nothing to run" case explicit.
        # The selector's exit status is checked explicitly rather than through
        # `set -e`, whose behaviour varies by shell - implicit status handling is
        # what hid this in the first place.
        - |
            if node ci/selectTargetedJestFiles.js "origin/$CI_DEFAULT_BRANCH" > /tmp/targeted-jest-files.z; then
                if [ -s /tmp/targeted-jest-files.z ]; then
                    xargs -0 npm test -- --config ci/jest.web.config.js --runInBand --findRelatedTests --passWithNoTests < /tmp/targeted-jest-files.z
                else
                    echo "No Jest input selected, so no suites will run. See the selection summary above for why."
                fi
            else
                echo "ERROR: the targeted Jest selection failed, so this job would test nothing. Failing instead of reporting success." >&2
                exit 1
            fi
    rules:
        # Must precede the generic web-relevant rule: first match wins, and a
        # dependency-changing branch has to run against its own image.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths:
                  - .gitlab-ci.yml
                  - ci/ensureMergeBase.sh
                  - ci/jestSetup.js
                  - ci/jest.web.config.js
                  - ci/selectTargetedJestFiles.js
                  - ci/writeTestEnv.js

# test:web:changed selects suites from the branch-vs-master diff, which is empty
# by construction on master and develop — so it is excluded there, and until this
# job existed it was the ONLY job in the pipeline running Jest. Both deploy paths,
# production and staging, therefore shipped on a successful webpack compile alone.
# This runs the whole web suite on those two branches and gates their deploys
# (see the `needs` on deploy:web and deploy:web-dev — without being in `needs` a
# test job only goes red *beside* a deploy that already shipped).
# The cost is small next to what it guards: it shares the build_web stage with a
# ~9-minute production build, so it adds little wall clock.
# Its rules deliberately mirror build_web_production/build_web_staging, so
# whenever a deploy is in the pipeline this job is too and `needs` always resolves.
test:web:full:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_base:latest
    before_script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        # Same reason as test:web:changed: .env is not in the repository and
        # react-native-dotenv resolves those imports during transform, so without
        # placeholders every suite reaching utils/backends/firestore.js fails to parse.
        - node ci/writeTestEnv.js
    script:
        # Scoped by the deploy marker rather than by `changes:` on master, for the reason
        # in deploy_scope's comment: this job gates deploy:web through `needs`, so it has
        # to exist in every pipeline that might deploy the web — including one whose own
        # push touched nothing web-relevant but which has to ship what a superseded
        # pipeline left behind. Exit 76 = "web is already up to date". Translate that
        # expected no-op to a successful early exit so GitLab does not label it a failed
        # job; every other non-zero status remains a real failure.
        - sh ci/deployScope.sh require web-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        # No selection step here — this is the whole web suite by design.
        # ci/jest.web.config.js excludes functions/, whose separate dependency
        # tree this image does not carry.
        # Several legacy suites print React warnings for every render. Their noise can hit
        # GitLab's 4 MB trace cap before Jest reports the failing assertion, as pipeline 8605 did.
        # `--silent` suppresses test console calls, not assertion output or Jest's suite summary.
        - npm test -- --config ci/jest.web.config.js --runInBand --silent
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes: *web-relevant-paths

# Behavioral authorization gate for Firestore rules. This runs against the
# official emulator and exercises real get/list/write decisions; compilation
# alone cannot detect a query that the rules engine cannot prove safe.
test:firestore:rules:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_base:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    before_script:
        - ln -s /app/node_modules node_modules
    script:
        - npm run test:firestore-rules
    rules:
        # Dependency-changing feature branches build a branch-scoped image.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG
        # Keep the gate present on every production pipeline: the manual deploy
        # names it in `needs`, including catch-up pipelines selected by markers.
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
              - firestore.rules
              - firebase.json
              - package.json
              - package-lock.json
              - ci/Dockerfile_base
              - ci/check-firestore-rule-coverage.js
              - __tests__/Firestore/**/*
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths:
                  - firestore.rules
                  - firebase.json
                  - ci/check-firestore-rule-coverage.js
                  - __tests__/Firestore/**/*

build_web_staging:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:latest
    before_script:
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\n const GOOGLE_FIREBASE_WEB_DATABASE_URL = "'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'"\n const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\n const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\n const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\n const SENTRY_DSN = "'"$SENTRY_DSN"'"\n const HOSTING_URL = "'"$HOSTING_URL_DEV"'"\n const CURRENT_ENVIORNMENT = "'"$CURRENT_ENVIORNMENT_DEV"'"\n const NOTES_COLLABORATION_SERVER = "'"$NOTES_COLLABORATION_SERVER"'"\n const ALGOLIA_APP_ID = "'"$ALGOLIA_APP_ID_DEV"'"\n const ALGOLIA_SEARCH_ONLY_API_KEY = "'"$ALGOLIA_SEARCH_ONLY_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\n const IP_REGISTRY_API_KEY = "'"$IP_REGISTRY_API_KEY"'"\n const SIB_MARKETING_SERVICE_LIST = "'"$SIB_MARKETING_SERVICE_LIST_DEV"'"\n const GIPHY_API_KEY = "'"$GIPHY_API_KEY_DEV"'"\n const PERPLEXITY_API_KEY = "'"$PERPLEXITY_API_KEY_DEV"'"' utils/backends/firestore.js
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"' apis/google/apisConfig.js
        - echo "DEBUG - Checking if MCP config file exists before replacement:"
        - ls -la functions/MCP/config/environments.js || echo "MCP config file not found"
        - echo "DEBUG - Content before MCP replacement:"
        - grep -A 10 -B 5 "BEGIN-ENVS" functions/MCP/config/environments.js || echo "BEGIN-ENVS not found"
        - echo "DEBUG - Environment variables being used for MCP (DEV):"
        - echo "API_KEY:" ${GOOGLE_FIREBASE_WEB_API_KEY_DEV:0:20}...
        - echo "AUTH_DOMAIN:" $GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV
        - echo "PROJECT_ID:" $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV
        - echo "MCP_BASE_URL_DEV:" $MCP_BASE_URL_DEV
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_DEV"'"' functions/MCP/config/environments.js
        - echo "DEBUG - Content after MCP replacement:"
        - grep -A 10 -B 5 "GOOGLE_FIREBASE_WEB_API_KEY" functions/MCP/config/environments.js || echo "Replacement failed"
        - sed -i 's|__FIREBASE_API_KEY__|'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'|g; s|__FIREBASE_AUTH_DOMAIN__|'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'|g; s|__FIREBASE_DATABASE_URL__|'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'|g; s|__FIREBASE_PROJECT_ID__|'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'|g; s|__FIREBASE_STORAGE_BUCKET__|'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'|g; s|__FIREBASE_MESSAGING_SENDER_ID__|'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'|g; s|__FIREBASE_APP_ID__|'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'|g' web/firebase-messaging-sw.js
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - web-build/
            - firebase.json
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes: *web-relevant-paths

# Feature-branch web build on the webpack pipeline (web-bundler/, Node 22).
# develop and master run the real build_web_staging / build_web_production jobs
# (same pipeline, env-specific injection); this job gives branches compile
# signal and feeds the manual preview-channel deploy.
build_web_webpack_check:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:$APP_IMAGE_TAG
    variables:
        APP_IMAGE_TAG: latest
    before_script:
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\n const GOOGLE_FIREBASE_WEB_DATABASE_URL = "'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'"\n const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\n const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\n const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\n const SENTRY_DSN = "'"$SENTRY_DSN"'"\n const HOSTING_URL = "'"$HOSTING_URL_DEV"'"\n const CURRENT_ENVIORNMENT = "'"$CURRENT_ENVIORNMENT_DEV"'"\n const NOTES_COLLABORATION_SERVER = "'"$NOTES_COLLABORATION_SERVER"'"\n const ALGOLIA_APP_ID = "'"$ALGOLIA_APP_ID_DEV"'"\n const ALGOLIA_SEARCH_ONLY_API_KEY = "'"$ALGOLIA_SEARCH_ONLY_API_KEY_DEV"'"\n const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\n const IP_REGISTRY_API_KEY = "'"$IP_REGISTRY_API_KEY"'"\n const SIB_MARKETING_SERVICE_LIST = "'"$SIB_MARKETING_SERVICE_LIST_DEV"'"\n const GIPHY_API_KEY = "'"$GIPHY_API_KEY_DEV"'"\n const PERPLEXITY_API_KEY = "'"$PERPLEXITY_API_KEY_DEV"'"' utils/backends/firestore.js
        - sed -i '/BEGIN-ENVS/,/END-ENVS/c\const GOOGLE_FIREBASE_WEB_CLIENT_ID = "'"$GOOGLE_FIREBASE_WEB_CLIENT_ID_DEV"'"\n const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"' apis/google/apisConfig.js
        - sed -i 's|__FIREBASE_API_KEY__|'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'|g; s|__FIREBASE_AUTH_DOMAIN__|'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'|g; s|__FIREBASE_DATABASE_URL__|'"$GOOGLE_FIREBASE_WEB_DATABASE_URL_DEV"'|g; s|__FIREBASE_PROJECT_ID__|'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'|g; s|__FIREBASE_STORAGE_BUCKET__|'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'|g; s|__FIREBASE_MESSAGING_SENDER_ID__|'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'|g; s|__FIREBASE_APP_ID__|'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'|g' web/firebase-messaging-sw.js
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    artifacts:
        expire_in: 1 days
        when: on_success
        name: 'web-build-webpack'
        paths:
            - web-build/
            - firebase.json
    rules:
        # Must precede the generic web-relevant rule: first match wins, and a
        # dependency-changing branch has to build against its own image.
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *branch-image-paths
          variables:
              APP_IMAGE_TAG: $CI_COMMIT_REF_SLUG
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths

build_web_production:
    stage: build_web
    image: $CI_REGISTRY_IMAGE/build_web_bundler:latest
    # This job used to mirror master to GitHub in its before_script, which gave it an
    # external side effect and therefore `interruptible: false` — so a superseded master
    # push still burned a full ~9-minute production build. The mirror is now the separate
    # `mirror:github` job, leaving this a pure build that can be auto-cancelled again.
    before_script:
        # Scoped by the deploy marker, not by `changes:` — see deploy_scope. Exit 76 means
        # the live site already has this commit's web content; end green without building.
        - sh ci/deployScope.sh require web-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        - pwd
        - ls -la ci/
        - chmod +x ci/replace-envs.sh
        - sh ci/replace-envs.sh
    script:
        - ln -s /app/node_modules node_modules
        - cp -R -f replacement_node_modules/* node_modules/
        - ln -s /bundler/node_modules web-bundler/node_modules
        - cd web-bundler && npm run build
    artifacts:
        expire_in: 1 days
        when: on_success
        paths:
            - web-build/
            - firebase.json
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Manual feature-branch QA gate: publish the branch build's artifact to a Firebase
# Hosting preview channel on the staging project (.firebaserc default; the build injects
# the _DEV env values, so the artifact talks to staging). Master and develop already have
# their real environment-specific build/deploy jobs, and build_web_webpack_check does not
# run there, so offering this preview job on those branches was both redundant and capable
# of running without the artifact it expects.
deploy:web-webpack-preview:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - 'build_web_webpack_check'
    script:
        - firebase --version
        - firebase hosting:channel:deploy --token $GOOGLE_FIREBASE_DEPLOY_TOKEN webpack-$CI_COMMIT_REF_SLUG
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
          when: manual
          allow_failure: true

# Staging's live site is normally published by deploy:web-dev from `develop`, but
# that branch has drifted far behind master, so a feature branch has no way to
# reach it. The preview channel above covers most QA, but NOT Google sign-in:
# Google Identity Services enforces an authorized-JavaScript-origin allowlist on
# the OAuth client, and a generated preview origin is not on it (that list lives
# in Google Cloud Console, so no deploy can add it). This job publishes a branch
# build to the staging site's live channel, on the registered origin, so auth
# flows can actually be tested before a stage merges.
# Manual and never automatic — it replaces whatever staging currently serves. The
# project is named explicitly rather than relying on the .firebaserc default, so a
# mis-click cannot reach production.
deploy:web-staging-live:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - job: 'build_web_webpack_check'
          optional: true
    script:
        - firebase --version
        - firebase use $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
    environment:
        name: staging
    interruptible: false
    rules:
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
          changes:
              compare_to: 'refs/heads/master'
              paths: *web-relevant-paths
          when: manual
          allow_failure: true

deploy:web:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    # Serialize production hosting deploys, matching the functions and runner jobs. Two
    # pushes in quick succession otherwise upload two bundles to the same site at once, and
    # the newest-commit guard below can only order deploys it can see one at a time.
    resource_group: web-production-deploy
    needs:
        - 'build_web_production'
        # Blocking on purpose: a test job outside `needs` only turns red next to
        # a deploy that has already shipped.
        - 'test:web:full'
        # Carries deploy-scope.env. An explicit `needs` list replaces the default
        # "artifacts from every earlier stage", so without this the scope check below
        # would find no artifact and fall back to deploying unconditionally.
        - 'deploy_scope'
        # Hosting can call functions introduced by the same commit. Both deploy jobs live in
        # this stage, so make the backend finish first instead of briefly publishing a client
        # whose callable does not exist yet.
        - job: 'deploy:cloud:functions:production'
          artifacts: false
    script:
        # build_firebase:latest only gains git once firebase_cmd_cache rebuilds it, and that
        # happens in this same pipeline — a runner holding a cached :latest would otherwise
        # hit a guard that cannot probe and correctly fails closed, blocking a legitimate
        # deploy. This no-ops on every image that already has git.
        - command -v git >/dev/null 2>&1 || apk add --no-cache git
        # Exit 76 = the live site already serves this content. Checked before the newest-
        # commit guard so a no-op pipeline reports "nothing to do" rather than "superseded".
        - sh $CI_PROJECT_DIR/ci/deployScope.sh require web-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        # A stale pipeline would replace the live bundle with an older build. See
        # ci/assertNewestCommit.sh; exit 75 means "superseded", declared allowed below.
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:web
        - firebase use $GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        # Only after the deploy actually succeeded: this is what lets the NEXT pipeline
        # tell what production is really running, including anything a superseded pipeline
        # never shipped.
        - sh $CI_PROJECT_DIR/ci/deployScope.sh record web-production
    environment:
        name: production
    interruptible: false
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:web-dev:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    needs:
        - 'build_web_staging'
        # Blocking on purpose, same as deploy:web.
        - 'test:web:full'
        - job: 'deploy:cloud:functions:staging'
          artifacts: false
          optional: true
    script:
        - firebase --version
        # develop is dormant, so pushes there rarely race — but the guard costs one
        # `git ls-remote` and staging is still last-writer-wins over a whole environment.
        # Staging deliberately keeps `rules: changes:` scoping rather than deploy markers:
        # with no concurrent pushes there is nothing for a marker to catch up.
        - command -v git >/dev/null 2>&1 || apk add --no-cache git
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:web-dev
        - firebase deploy --only hosting --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
    environment:
        name: staging
    interruptible: false
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes: *web-relevant-paths

deploy:cloud:functions:staging:
    image: $CI_REGISTRY_IMAGE/build_functions:latest
    stage: deploy_web
    # Serialize functions deploys: two pushes in quick succession otherwise run
    # `firebase deploy` concurrently and the older commit can finish last,
    # overwriting the newer code (last writer wins per function).
    resource_group: functions-staging-deploy
    interruptible: false
    before_script:
        - echo "DEBUG - Replacing MCP config for functions deployment"
        - echo "Environment variables for MCP functions (DEV):"
        - echo "API_KEY:" ${GOOGLE_FIREBASE_WEB_API_KEY_DEV:0:20}...
        - echo "AUTH_DOMAIN:" $GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV
        - echo "PROJECT_ID:" $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV
        - echo "MCP_BASE_URL_DEV:" $MCP_BASE_URL_DEV
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_DEV"'"' functions/MCP/config/environments.js
        - echo "DEBUG - MCP config after replacement:"
        - grep -A 10 -B 5 "GOOGLE_FIREBASE_WEB_API_KEY" functions/MCP/config/environments.js || echo "Replacement failed"
        - cd functions
        - ln -s /functions/node_modules node_modules
        - echo "$GOOGLE_SERVICE_ACCOUNT_DEVELOP" > service_accounts/serv_account_key_develop.json
        - echo "$GOOGLE_SERVICE_ACCOUNT_MASTER" > service_accounts/serv_account_key_master.json
        - echo "$GOOGLE_FUNCTIONS_ENV_DEV" > env_functions.json
        - chmod +x service_accounts/setup_functions.sh
        - npm run setup_functions
    script:
        # Same reasoning as deploy:web-dev — `--force` prunes functions absent from the
        # source being deployed, so an out-of-order staging deploy deletes work too.
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:cloud:functions:staging
        - firebase use $(< tmp_project_name) --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only functions --token $GOOGLE_FIREBASE_DEPLOY_TOKEN --non-interactive --force -m "Pipeline $CI_PIPELINE_ID, build $CI_BUILD_ID"
        - rm -rf tmp_project_name
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
              - functions/**/*
              # firebase.json carries the functions runtime, region and ignore list,
              # so a change there has to redeploy them too.
              - firebase.json

deploy:cloud:functions:production:
    image: $CI_REGISTRY_IMAGE/build_functions:latest
    stage: deploy_web
    # Serialize functions deploys: two pushes in quick succession otherwise run
    # `firebase deploy` concurrently and the older commit can finish last,
    # overwriting the newer code (last writer wins per function).
    resource_group: functions-production-deploy
    interruptible: false
    # Without this the job downloads every earlier-stage artifact, i.e. the whole
    # web-build/ bundle it has no use for. It only needs the scope file.
    dependencies:
        - 'deploy_scope'
    before_script:
        # First, before any of the setup below: exit 76 when the deployed functions already
        # match this commit. Scoped by the deploy marker rather than `changes:` so this job
        # also ships what a superseded pipeline skipped — see deploy_scope.
        - sh ci/deployScope.sh require functions-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        - echo "Environment variables for MCP functions (PROD):"
        - echo "API_KEY:" ${GOOGLE_FIREBASE_WEB_API_KEY_PROD:0:20}...
        - echo "AUTH_DOMAIN:" $GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_PROD
        - echo "PROJECT_ID:" $GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD
        - echo "MCP_BASE_URL_PROD:" $MCP_BASE_URL_PROD
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_PROD"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_PROD"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_PROD"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_PROD"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_PROD"'"\
            const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_PROD"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_PROD"'"' functions/MCP/config/environments.js
        - cd functions
        - ln -s /functions/node_modules node_modules
        - echo "$GOOGLE_SERVICE_ACCOUNT_DEVELOP" > service_accounts/serv_account_key_develop.json
        - echo "$GOOGLE_SERVICE_ACCOUNT_MASTER" > service_accounts/serv_account_key_master.json
        - echo "$GOOGLE_FUNCTIONS_ENV_PROD" > env_functions.json
        - chmod +x service_accounts/setup_functions.sh
        - npm run setup_functions
    script:
        # THE job this guard was written for. `--force` makes the deployed source the
        # desired state, so a stale pipeline DELETES functions a newer commit added and
        # reverts the rest, reporting success throughout (AT-2221, 2026-08-10). Checked
        # here rather than in before_script so the window between the check and the deploy
        # is as small as possible. Exit 75 means "superseded", declared allowed below.
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:cloud:functions:production
        - firebase use $(< tmp_project_name) --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only functions --token $GOOGLE_FIREBASE_DEPLOY_TOKEN --non-interactive --force -m "Pipeline $CI_PIPELINE_ID, build $CI_BUILD_ID"
        - rm -rf tmp_project_name
        # Only after a successful deploy. The path list lives in
        # ci/deploy-scope/functions-production.paths (functions/ plus firebase.json, which
        # carries the runtime, region and ignore list).
        - sh $CI_PROJECT_DIR/ci/deployScope.sh record functions-production
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Rebuild the vm-job-runner Cloud Run Job image whenever functions code changes, so VM
# jobs run the current functions/ code (esp. vmJobRunner.js). The job runs from this image,
# NOT the Functions runtime, so a plain `firebase deploy --only functions` does not update it.
# One-time project setup (API enablement, Artifact Registry repo, job IAM) is done by an admin
# via a normal deploy.sh run; CI passes CI_MODE=1 to skip those and only rebuild + redeploy.
deploy:cloud:runner:staging:
    image: google/cloud-sdk:slim
    stage: deploy_web
    resource_group: runner-staging-deploy
    interruptible: false
    before_script:
        - echo "$GOOGLE_SERVICE_ACCOUNT_DEVELOP" > /tmp/runner-deploy-sa.json
        - gcloud auth activate-service-account --key-file=/tmp/runner-deploy-sa.json
        # Secrets baked into the image (getEnvFunctions reads functions/env_functions.json).
        - echo "$GOOGLE_FUNCTIONS_ENV_DEV" > functions/env_functions.json
        # Match the functions deploy's MCP config replacement so the baked image is consistent.
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_DEV"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_DEV"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_DEV"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_DEV"'"\
            const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_DEV"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_DEV"'"' functions/MCP/config/environments.js
    script:
        - command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git)
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:cloud:runner:staging
        - cd functions/Assistant/cloud-run-job
        - CI_MODE=1 bash deploy.sh alldonestaging firebase-adminsdk-9idaq@alldonestaging.iam.gserviceaccount.com
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
              - functions/**/*

deploy:cloud:runner:production:
    image: google/cloud-sdk:slim
    stage: deploy_web
    resource_group: runner-production-deploy
    interruptible: false
    dependencies:
        - 'deploy_scope'
    before_script:
        # Exit 76 when the baked runner image already matches this commit's functions/
        # source. Marker-scoped, so it also covers what a superseded pipeline skipped.
        - sh ci/deployScope.sh require runner-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        - echo "$GOOGLE_SERVICE_ACCOUNT_MASTER" > /tmp/runner-deploy-sa.json
        - gcloud auth activate-service-account --key-file=/tmp/runner-deploy-sa.json
        - echo "$GOOGLE_FUNCTIONS_ENV_PROD" > functions/env_functions.json
        - |
            sed -i '/BEGIN-ENVS/,/END-ENVS/c\
            const GOOGLE_FIREBASE_WEB_API_KEY = "'"$GOOGLE_FIREBASE_WEB_API_KEY_PROD"'"\
            const GOOGLE_FIREBASE_WEB_AUTH_DOMAIN = "'"$GOOGLE_FIREBASE_WEB_AUTH_DOMAIN_PROD"'"\
            const GOOGLE_FIREBASE_WEB_PROJECT_ID = "'"$GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD"'"\
            const GOOGLE_FIREBASE_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_STORAGE_BUCKET_PROD"'"\
            const GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID = "'"$GOOGLE_FIREBASE_WEB_MESSAGING_SENDER_ID_PROD"'"\
            const GOOGLE_FIREBASE_WEB_APP_ID = "'"$GOOGLE_FIREBASE_WEB_APP_ID_PROD"'"\
            const GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET = "'"$GOOGLE_FIREBASE_WEB_NOTES_STORAGE_BUCKET_PROD"'"\
            const MCP_BASE_URL = "'"$MCP_BASE_URL_PROD"'"' functions/MCP/config/environments.js
    script:
        # The guard fails closed, so make sure its primary probe can actually run: this
        # image is upstream (not built here), and a variant without git would otherwise
        # block a legitimate deploy. No-ops whenever git is already present.
        - command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git)
        # Builds the vm-job-runner image from functions/ source, so a stale pipeline ships
        # an older vmJobRunner.js to every VM job. Exit 75 means "superseded".
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:cloud:runner:production
        - cd functions/Assistant/cloud-run-job
        - CI_MODE=1 bash deploy.sh alldonealeph firebase-adminsdk-mpg7p@alldonealeph.iam.gserviceaccount.com
        - sh $CI_PROJECT_DIR/ci/deployScope.sh record runner-production
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Publish Firestore security rules to production.
#
# Until AT-2450 nothing in CI deployed firestore.rules at all - only hosting, functions
# and the runner - so the file was the source of truth for reviewers while production ran
# whatever was last pushed by hand. The failure is silent in the worst way: rules are the
# authorization layer, so an undeployed tightening leaves a hole open and an undeployed
# relaxation leaves a shipped feature inert, and BOTH look like a green pipeline. AT-2450
# hit the second case - the callables went live accepting project members while the live
# rules still said `allow write: if isAdministrator()`, so every client write was denied.
#
# `--only firestore:rules` publishes one compiled file as one release; it has no
# desired-state diff and therefore none of the index job's deletion hazard (see the
# long comment below). It is still an authorization cutover for the whole application,
# so publication is automatic only after the behavioral rules suite, the complete web
# suite and the production bundle have all passed. Syntax compilation alone did not catch
# AT-2450's query/rule incompatibilities. --force is deliberately NOT passed: it buys
# nothing here and is the exact flag that makes the indexes deploy destructive.
deploy:firestore:rules:production:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    # Serialize with itself for the same reason as the other production deploys: two
    # pushes in quick succession otherwise publish two rule releases at once and the
    # newest-commit guard can only order deploys it sees one at a time.
    resource_group: firestore-rules-production-deploy
    # Rules are published automatically, but never from a partially validated pipeline.
    # The two web gates are relevant when a commit changes both the client and its access
    # contract; when no web content needs shipping they finish as marker-scoped no-ops.
    needs:
        - 'deploy_scope'
        - 'test:firestore:rules'
        - job: 'build_web_production'
          artifacts: false
        - job: 'test:web:full'
          artifacts: false
    script:
        # Same reasoning as deploy:web - the guard fails closed, so make sure its probe
        # can run on a cached image that predates git being added.
        - command -v git >/dev/null 2>&1 || apk add --no-cache git
        # Exit 76 = the live rules already match this commit. Checked before the newest-
        # commit guard so a no-op pipeline reports "nothing to do" rather than "superseded".
        - sh $CI_PROJECT_DIR/ci/deployScope.sh require firestore-rules-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        # A stale pipeline would republish an older ruleset over a newer one, silently
        # reopening whatever the newer commit closed. Exit 75 means "superseded".
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh deploy:firestore:rules:production
        - firebase use $GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD --token $GOOGLE_FIREBASE_DEPLOY_TOKEN
        - firebase deploy --only firestore:rules --token $GOOGLE_FIREBASE_DEPLOY_TOKEN --non-interactive -m "Pipeline $CI_PIPELINE_ID, build $CI_BUILD_ID"
        # Only after a successful release, so a failed deploy is retried by the next
        # pipeline instead of being marked as shipped.
        - sh $CI_PROJECT_DIR/ci/deployScope.sh record firestore-rules-production
    environment:
        name: production
    interruptible: false
    allow_failure:
        exit_codes: 75
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Report drift between firestore.indexes.json and the live Firestore indexes.
#
# These jobs are READ-ONLY on purpose. CI cannot deploy indexes safely:
#   - with --force, `firebase deploy --only firestore:indexes` DELETES every live
#     index and field override the file omits (~200 indexes and 69 single-field
#     index exemptions back when this file had drifted), so --force is never an
#     option here;
#   - without --force but with --non-interactive, firebase-tools does NOT fall back
#     to "create only". Its confirm() helper throws outright as soon as anything
#     live is missing from the file, and it throws before creating anything.
#     Production always has at least one such index - a `tasks` index on `__name__`
#     alone, which the file format cannot express - so a non-interactive deploy can
#     only ever fail. This job used to run one and reliably failed the pipeline.
#
# To create missing indexes, run the deploy interactively and answer "no" when it
# offers to delete the undeclared ones; that path creates and then skips deletions:
#   firebase deploy --only firestore:indexes --project <projectId>
check:firestore:indexes:staging:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    # Read-only drift report; it needs no build artifacts.
    dependencies: []
    script:
        - firebase --version
        # Staging legitimately holds indexes production does not, so report drift
        # without failing the pipeline.
        - node ci/check-firestore-indexes.js $GOOGLE_FIREBASE_WEB_PROJECT_ID_DEV --warn-only
    environment:
        name: staging
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'

check:firestore:indexes:production:
    image: $CI_REGISTRY_IMAGE/build_firebase:latest
    stage: deploy_web
    dependencies: []
    script:
        - firebase --version
        # The file mirrors production, so any difference here is real drift worth
        # a red pipeline.
        - node ci/check-firestore-indexes.js $GOOGLE_FIREBASE_WEB_PROJECT_ID_PROD
    environment:
        name: production
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

update:version:staging:
    image: curlimages/curl
    stage: 'update_version'
    rules:
        - if: '$CI_COMMIT_BRANCH == "develop"'
    interruptible: false
    script:
        - curl "$NEW_APP_VERSION_FUNCTION_DEV"

# Tells the live app a new version is available, which makes clients reload. It therefore
# has to fire only when a web deploy actually happened: it used to run on every master
# push, including pushes that changed no web file at all and pushes whose deploy was
# skipped as superseded, so users were being asked to reload for a bundle that had not
# changed.
#
# The guard needs git. Its GitLab API fallback cannot stand in for that here: CI_JOB_TOKEN
# is only accepted on a small allowlist of endpoints, and `/repository/branches/:branch` is
# not one of them, so the probe 401s and the guard correctly fails CLOSED (exit 1, which is
# not in allow_failure). On `curlimages/curl` that made the job fail on every master push —
# and because this job is what tells clients to reload, a broken version bump leaves users
# on a stale bundle, which is exactly the symptom the guard was added to avoid. Use an image
# where both git and curl can be installed (curlimages/curl runs as a non-root user, so it
# cannot apk add).
update:version:production:
    image: alpine:3.20
    stage: 'update_version'
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    interruptible: false
    dependencies:
        - 'deploy_scope'
    before_script:
        - apk add --no-cache git curl
    script:
        - sh $CI_PROJECT_DIR/ci/deployScope.sh require web-production || { status=$?; if [ "$status" -eq 76 ]; then exit 0; fi; exit "$status"; }
        - sh $CI_PROJECT_DIR/ci/assertNewestCommit.sh update:version:production
        - curl "$NEW_APP_VERSION_FUNCTION_PROD"
    allow_failure:
        exit_codes: 75
